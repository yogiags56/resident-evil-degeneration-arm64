
name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang and liblzma
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblzma-dev pkg-config

      - name: Run host tests
        run: bash ./tools/run_tests.sh
        

      - name: Report tracked source SHA-256 provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | while IFS= read -r -d '' path; do
            sha256sum -- "$path"
          done
