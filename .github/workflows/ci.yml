
name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang and liblzma
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblzma-dev pkg-config

      - name: Run host tests
        shell: bash
        run: |
          mkdir -p build/host-tests
          set +e
          bash ./tools/run_tests.sh > build/host-tests/ci-host-tests.log 2>&1
          status=$?
          cat build/host-tests/ci-host-tests.log
          exit "$status"

      - name: Upload host test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-diagnostics
          path: build/host-tests/ci-host-tests.log
          if-no-files-found: warn
          retention-days: 7
        

      - name: Report tracked source SHA-256 provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | while IFS= read -r -d '' path; do
            sha256sum -- "$path"
          done
