name: Android ARM64 native build

on:
  workflow_dispatch:
  push:
    branches: [main, stage-120z-dependency-graph-resolution]
    paths:
      - "app/**"
      - "runtime/**"
      - "tools/**"
      - "config/**"
      - "gradle/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/android-arm64.yml"
  pull_request:
    paths:
      - "app/**"
      - "runtime/**"
      - "tools/**"
      - "config/**"
      - "gradle/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/android-arm64.yml"

permissions:
  contents: read

# Cancel superseded native builds for the same branch/PR.
concurrency:
  group: android-arm64-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Android SDK paths
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_LIBLZMA_ROOT=$GITHUB_WORKSPACE/.deps/install/liblzma-android-arm64" >> "$GITHUB_ENV"

      - name: Install pinned Android command-line tools, SDK and NDK
        run: bash tools/install_android_sdk_packages.sh

      - name: Verify NDK environment handoff
        shell: bash
        run: |
          test -n "${ANDROID_NDK_HOME:-}"
          test -f "$ANDROID_NDK_HOME/source.properties"
          grep -q '^Pkg.Revision = 30.0.16248370$' "$ANDROID_NDK_HOME/source.properties"
          echo "Verified NDK: $ANDROID_NDK_HOME"

      - name: Install pinned Gradle distribution
        shell: bash
        run: |
          GRADLE_HOME="$(bash tools/install_gradle_distribution.sh | tail -n 1)"
          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle --version

      - name: Fetch and verify XZ Utils
        run: bash tools/fetch_xz_source.sh

      - name: Build Android ARM64 liblzma
        run: bash tools/build_liblzma_android_arm64.sh

      - name: Build Android ARM64 app and verify ELF
        run: bash tools/build_android_arm64.sh

      - name: Collect build artifacts
        run: |
          python3 tools/collect_android_build_artifacts.py \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/dist/android-arm64"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resident-evil-degeneration-arm64-stage123d-xe3u-relocation
          path: dist/android-arm64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
