plugins { id 'com.android.application' }

android {
    namespace 'org.example.redstage'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '30.0.16248370'
    defaultConfig {
        applicationId 'org.example.redstage'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0-stage115'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-Wall -Wextra -Werror'
                arguments "-DRE_ENABLE_LIBLZMA=ON",
                          "-DLibLZMA_ROOT=${System.getenv('ANDROID_LIBLZMA_ROOT') ?: ''}"
            }
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
}
